<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vloga za soglasje</title>
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--fg:#1b1f24;--muted:#5d6670;--line:#dde1e6;--chip:#eef1f4;
  --acc:#0b62c4;--acc-fg:#fff;--ok:#1a7f37;--warn:#9a6700;--err:#c62828;
  --ok-bg:#e8f5ec;--warn-bg:#fff6dd;--err-bg:#fdecec;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131619;--card:#1c2025;--fg:#e6e9ed;--muted:#9aa4ae;--line:#2f353c;--chip:#262b31;
  --acc:#4c9bf0;--acc-fg:#0b1118;--ok:#4cc46b;--warn:#e0b44a;--err:#ef6b6b;
  --ok-bg:#16291c;--warn-bg:#2d2512;--err-bg:#331a1a;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header.top{display:flex;align-items:center;gap:16px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{font-weight:650}
nav{display:flex;gap:6px;margin-left:auto}
main{max-width:1280px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:14px;margin:12px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(210px,100%),1fr));gap:10px 14px}
.editor{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.editor aside{position:sticky;top:64px}
@media (max-width:1000px){.editor{grid-template-columns:minmax(0,1fr)}.editor aside{position:static}}
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
label.f.wide{grid-column:1/-1}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
textarea{width:100%;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
label.c{display:flex;gap:8px;align-items:center;font-size:14px}
button,.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:6px;padding:6px 11px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover{border-color:var(--acc)}
button.pri,.btn.pri{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
button.danger{color:var(--err)}
button.sm,.btn.sm{padding:3px 8px;font-size:13px}
button.on{outline:2px solid var(--acc)}
button:disabled{opacity:.5;cursor:default}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600}
td input,td select{width:100%}
td input[type=checkbox]{width:auto}
.tbl-wrap{overflow-x:auto}
.tbl-wrap table.siroka{min-width:860px}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--chip)}
.muted{color:var(--muted)}
.small{font-size:13px}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--chip);white-space:nowrap}
.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.chk li{padding:6px 9px;border-radius:6px}
.chk .err{background:var(--err-bg);color:var(--err)}
.chk .warn{background:var(--warn-bg);color:var(--warn)}
.chk .ok{background:var(--ok-bg);color:var(--ok)}
.big{font-size:26px;font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.banner{background:var(--err-bg);color:var(--err);padding:8px 16px;font-size:14px;border-bottom:1px solid var(--line)}
.pril{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.pril:last-child{border-bottom:0}
.pril .meta{grid-column:1/3;font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.bad{color:var(--err)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
#toast.show{opacity:1}
.pv{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:flex;padding:16px}
.pv[hidden]{display:none}
.pv-box{background:var(--card);border-radius:10px;flex:1;display:flex;flex-direction:column;gap:8px;padding:10px;max-width:1000px;margin:0 auto}
.pv iframe{flex:1;width:100%;border:1px solid var(--line);border-radius:6px;background:#fff}
/* pomočnik za oddajo */
.wiz{max-width:860px;margin:0 auto}
.korak{padding:0;overflow:hidden}
.korak > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 16px;font-weight:600}
.korak > summary::-webkit-details-marker{display:none}
.korak .num{width:26px;height:26px;border-radius:50%;background:var(--err);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.korak.done .num{background:var(--ok)}
.korak .prog{margin-left:auto;font-weight:400;font-size:13px;color:var(--muted)}
.vr{display:grid;grid-template-columns:24px minmax(0,220px) minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:7px 16px;border-top:1px solid var(--line)}
.vr .lab{font-size:13px;color:var(--muted)}
.vr .val{font-variant-numeric:tabular-nums;word-break:break-word}
.vr .val .izb{font-weight:600}
.vr .hint{grid-column:2/5;font-size:12px;color:var(--muted)}
.vr.sub{background:var(--chip)}
.vr.sub .lab{color:var(--fg);font-weight:600}
.vr.ok .val{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.vr.miss .val{color:var(--err)}
@media (max-width:640px){.vr{grid-template-columns:24px minmax(0,1fr) auto}.vr .lab{grid-column:2/4}.vr .val{grid-column:2/3}.vr .hint{grid-column:2/4}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Vloga za soglasje</div>
  <nav>
    <button data-act="view" data-v="list">Vloge</button>
    <button data-act="view" data-v="settings">Nastavitve</button>
  </nav>
</header>
<div id="banner"></div>
<main id="app"></main>
<div id="pv" class="pv" hidden><div class="pv-box">
  <div class="row"><b id="pvTitle"></b><span style="margin-left:auto"></span>
    <a id="pvOpen" class="btn sm" target="_blank" rel="noopener">Odpri v novem zavihku</a>
    <button class="sm pri" data-act="pvDl">Prenesi</button><button class="sm" data-act="pvClose">Zapri</button></div>
  <iframe id="pvFrame" title="Predogled dokumenta"></iframe>
</div></div>
<div id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="importKat" accept="application/json,.json" hidden>
<script src="lib/pdf-lib.min.js"></script>
<script src="lib/fontkit.umd.min.js"></script>
<script src="lib/viri.js"></script>
<script>
'use strict';

/* ---------- pomožne funkcije ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const num = v => { const n = parseFloat(String(v ?? '').replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : 0; };
const fmtN = (n, d = 2) => (Math.round(n * 10 ** d) / 10 ** d).toLocaleString('sl-SI', { maximumFractionDigits: d, useGrouping: false });
const fmtD = d => { if (!d) return ''; const [y, m, dd] = d.split('-'); return `${+dd}. ${+m}. ${y}`; };
const today = () => new Date().toISOString().slice(0, 10);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o));
const slug = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '');
// Združi neprazne dele (false, null, 0 in prazni nizi se izpustijo).
const join = (arr, sep = ', ') => arr.filter(Boolean).map(x => String(x).trim()).filter(Boolean).join(sep);
const MB = 1024 * 1024;
const fmtMB = b => b < 100 * 1024 ? `${Math.max(1, Math.round(b / 1024))} KB` : `${fmtN(b / MB, 1)} MB`;

function toast(t) {
  const el = $('#toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2600);
}
function getPath(o, p) { return p.split('.').reduce((a, k) => a == null ? a : a[k], o); }
function setPath(o, p, v) {
  const ks = p.split('.'); let a = o;
  ks.slice(0, -1).forEach(k => { if (a[k] == null) a[k] = {}; a = a[k]; });
  a[ks[ks.length - 1]] = v;
}
function download(name, data, type) {
  const blob = data instanceof Blob ? data : new Blob([data], { type });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
}
// Kontrolna številka slovenske davčne številke (8 mest, uteži 8..2, mod 11).
function davcnaOk(s) {
  s = String(s || '').replace(/\D/g, '');
  if (!/^[1-9]\d{7}$/.test(s)) return false;
  let sum = 0; for (let i = 0; i < 7; i++) sum += +s[i] * (8 - i);
  let k = 11 - (sum % 11); if (k === 10) k = 0; if (k === 11) return false;
  return k === +s[7];
}
// GSRN merilnega mesta (18 mest): kontrolna števka po GS1 (uteži 3 in 1 od desne).
function gs1Ok(s) {
  s = String(s || '').replace(/\s/g, '');
  if (!/^\d{18}$/.test(s)) return false;
  let sum = 0; for (let i = 0; i < 17; i++) sum += +s[16 - i] * (i % 2 ? 1 : 3);
  return (10 - sum % 10) % 10 === +s[17];
}
// »2230 Lenart« -> { st: '2230', kraj: 'Lenart' }
const postaRaz = p => { const m = String(p || '').trim().match(/^(?:SI-)?(\d{4})\s*(.*)$/i); return m ? { st: m[1], kraj: m[2].trim() } : { st: '', kraj: String(p || '').trim() }; };

/* ---------- spletni obrazec Elektro Maribor ---------- */
const DIST = { ime: 'Elektro Maribor', kratko: 'EM' };
const FORM_URL = 'https://mf-evloga.elektro-maribor.si/app/#/public/69d8ac978597050056b0ee9a/5a9d592cba67b9a200e1eff0';
const MAX_DAT = 4 * MB; // največja velikost ene priloge na spletnem obrazcu
// Možnosti so prepisane z uradne Enotne vloge EM (10/26). Če je besedilo na spletu drugačno, ga popravite tukaj.
const OPC = {
  shema: { 'PS.3A': 'PS.3A naprava za individualno samooskrbo', 'PS.3B': 'PS.3B naprava za skupnostno samooskrbo', 'PS.1B': 'PS.1B', 'PS.1C': 'PS.1C', 'PS.2': 'PS.2' },
  // Način obratovanja: na spletnem obrazcu so to 4 potrditvena polja, obkljuka se poljubne.
  obratovanje: { paralelno: 'Paralelno z DS', otocno: 'Otočno', P: 'P – porabniški (samo za svoje potrebe)', M: 'M – mešani (za svoje potrebe in oddajo)' },
  vir: { sonce: 'OVE – sonce', veter: 'OVE – veter', voda: 'OVE – voda' },
  tehnologija: { LFP: 'LFP', NMC: 'NMC', NCA: 'NCA', LTO: 'LTO', drugo: 'Drugo' },
  faze: { '3f': '3f', '1f': '1f' }
};
const STATUS = {
  priprava: 'V pripravi', podpis: 'Pooblastilo pri stranki', oddano: 'Oddano', dopolnitev: 'Poziv za dopolnitev',
  izdano: 'Soglasje izdano', zavrnjeno: 'Zavrnjeno'
};
// Priloge, ki jih dodate v orodje (ostanejo le do zaprtja strani).
const PRILOGE = {
  pooblastilo: { n: 'Podpisano pooblastilo investitorja', opis: 'Sken ali fotografija pooblastila, ki ga je podpisala stranka.' },
  enopolna: { n: 'Enopolna shema', opis: 'Shema naprave z vrisano točko priključitve v interno NN omrežje (PDF ali slika). Doda se v tehnično dokumentacijo.' },
  listi: { n: 'Tehnični listi opreme', opis: 'FN moduli, razsmerniki, hranilnik (PDF ali slike). Dodajo se v tehnično dokumentacijo.' },
  kataster: { n: 'Kopija katastrskega načrta in zazidalna situacija', opis: 'Neobvezno (npr. izpis iz GURS ali iObčine).' },
  ostalo: { n: 'Ostala dokazila', opis: 'Neobvezno: dokazilo o lastništvu, če objekt ni vpisan v zemljiško knjigo, najemna pogodba, soglasje solastnikov …' }
};

/* ---------- privzete nastavitve ---------- */
const DEFAULTS = {
  izvajalec: {
    naziv: 'ENSET d.o.o.', ulica: 'Kraigherjeva ulica', hs: '22', kraj: '', posta: '2230 Lenart v Slovenskih goricah', davcna: '55426310', maticna: '9304207000',
    zastopnik: 'Jure Hundrič', kontakt: '', tel: '0597 77 888', email: 'info@enset.si', splet: 'enset.si', podpis: ''
  },
  rules: {
    kontaktNas: true,     // kontaktna oseba v vlogi smo mi (na naš e-naslov pride potrdilo in številka vloge)
    letniDonos: 1100,     // kWh na kWp za oceno letne proizvodnje
    delezLastne: 40,      // % proizvodnje, ki se porabi doma (ocena)
    decimalka: ',',       // decimalno ločilo pri kopiranju števil
    dodatniPodatki: '',   // izbira v polju »Dodatni podatki potrebni za izdajo soglasja« (Pričetek), če je vedno ista
    vrstaNaprave: 'naprava za individualno samooskrbo',
    nazivNaprave: 'Sončna elektrarna'
  },
  katalog: { razsmerniki: [], hranilniki: [] },
  templates: {
    pooblastilo: {
      ime: 'Stranki – pooblastilo za podpis',
      zadeva: 'Sončna elektrarna – pooblastilo za vlogo za soglasje',
      telo:
`Pozdravljeni,

za vašo sončno elektrarno bomo pri {{distributer}} oddali vlogo za izdajo soglasja za priključitev. Vlogo oddamo mi, v vašem imenu.

V priponki je pooblastilo. Prosimo, da ga podpišete in nam vrnete (sken ali fotografija).{{blok_solastniki}}

{{blok_manjka}}

Lep pozdrav,
{{podpis}}`
    },
    oddano: {
      ime: 'Stranki – vloga oddana',
      zadeva: 'Vloga za soglasje je oddana – {{uporabnik}}',
      telo:
`Pozdravljeni,

vlogo za izdajo soglasja za priključitev smo oddali pri {{distributer}}{{st_vloge}}.

Naprava: {{naprava}}
Merilno mesto: {{mm}}, {{lokacija}}

Ko prejmemo soglasje, vas obvestimo.

Lep pozdrav,
{{podpis}}`
    }
  }
};

function merge(def, val) {
  if (Array.isArray(def)) return Array.isArray(val) ? val : clone(def);
  if (def && typeof def === 'object') {
    const out = {};
    for (const k of Object.keys(def)) out[k] = merge(def[k], val ? val[k] : undefined);
    if (val && typeof val === 'object') for (const k of Object.keys(val)) if (!(k in out)) out[k] = val[k];
    return out;
  }
  return val === undefined ? def : val;
}

/* ---------- shramba ---------- */
const LS_CASES = 'vs.vloge.v1', LS_SET = 'vs.nastavitve.v1';
function lsGet(k) { try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function lsSet(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); return true; }
  catch (e) { toast('Shranjevanje v brskalnik ni uspelo – naredite izvoz (varnostno kopijo).'); return false; }
}
let S = merge(DEFAULTS, lsGet(LS_SET));
for (const k of ['tel', 'email', 'splet']) if (!S.izvajalec[k]) S.izvajalec[k] = DEFAULTS.izvajalec[k];
let CASES = lsGet(LS_CASES) || [];
const FILES = {}; // caseId -> { kljucPriloge: [File] } – samo v tej seji
let state = { view: 'list', id: null, tpl: null };
let saveT;
const saveCases = () => { clearTimeout(saveT); saveT = setTimeout(() => lsSet(LS_CASES, CASES), 250); };
const saveSettings = () => lsSet(LS_SET, S);

const newParcela = (ko = '') => ({ ko, st: '', lastniki: { u: true } });
const newLastnik = () => ({ id: uid(), tip: 'fo', ime: '', priimek: '', naziv: '', ulica: '', hs: '', posta: '', davcna: '' });
const newRs = () => ({ proizvajalec: '', model: '', kva: '', kos: 1, faze: '3f', napetost: '', sodo: false });
const newHee = () => ({ proizvajalec: '', model: '', tehnologija: 'LFP', kwh: '', kwP: '', kwO: '', kos: 1, faze: '3f', napetost: '', sodo: false });
function newCase() {
  return {
    id: uid(), created: today(), updated: today(), status: 'priprava',
    vrste: { d: true, f: false },
    im: { tip: 'fo', ime: '', priimek: '', naziv: '', ulica: '', hs: '', kraj: '', posta: '', davcna: '', zavezanec: false, tel: '', email: '' },
    // Parcele in lastniki: vsak lastnik (tudi uporabnik, id 'u') podpiše svoje pooblastilo.
    parcele: [newParcela()],
    lastniki: [],
    plTretja: false,
    mm: { obstojece: true, st: '4-', gsrn: '', pmOdjem: '', enako: true, ulica: '', hs: '', kraj: '', posta: '', leto: String(new Date().getFullYear()), predhodna: '' },
    el: { naziv: '', vir: 'sonce', panelModel: '', panelKos: '', panelWp: '', pmObstojeca: '0', pmNova: '', shema: 'PS.3A', obr: { M: true }, sistemske: false, letno: '', lastne: '' },
    rs: [newRs()],
    hr: { shema: 'PS.3A', obr: { M: true }, sistemske: false, predhodnoSzp: '' },
    hee: [],
    opombe: '', opombeRocno: false,
    oddaja: { st: '', datum: '', szp: '', szpDatum: '', szpPm: '' },
    done: {}
  };
}
const cur = () => CASES.find(c => c.id === state.id);
CASES = CASES.map(c => {
  const n = merge(newCase(), c);
  for (const x of [n.el, n.hr]) { delete x.obratovanje; delete x.nacin; } // stari zapis (dve ločeni izbiri)
  // stari zapis: ena KO in parcele, ločene z vejico; solastniki kot imena
  if (c.mm && (c.mm.parcele || c.mm.ko) && !(c.parcele || []).some(x => x.st || x.ko)) {
    const sol = String(c.im?.solastniki ? c.im.solastnikiImena || '' : '').split(',').map(x => x.trim()).filter(Boolean)
      .map(ime => { const l = newLastnik(), d = ime.split(/\s+/); l.ime = d[0] || ''; l.priimek = d.slice(1).join(' '); return l; });
    n.lastniki = sol;
    const vsi = Object.fromEntries([['u', true], ...sol.map(l => [l.id, true])]);
    n.parcele = String(c.mm.parcele || '').split(',').map(x => x.trim()).filter(Boolean).map(st => ({ ko: c.mm.ko || '', st, lastniki: { ...vsi } }));
    if (!n.parcele.length) n.parcele = [{ ko: c.mm.ko || '', st: '', lastniki: { ...vsi } }];
  }
  delete n.mm.ko; delete n.mm.parcele; delete n.mm.vecKo; delete n.im.solastniki; delete n.im.solastnikiImena;
  return n;
});
// ---- parcele in lastniki ----
const parc = c => c.parcele.filter(x => String(x.ko).trim() || String(x.st).trim());
const koji = c => [...new Set(parc(c).map(x => String(x.ko).trim()).filter(Boolean))];
const koTxt = c => koji(c).join(', ');
const parceleTxt = (c, ko) => parc(c).filter(x => ko == null || String(x.ko).trim() === ko).map(x => String(x.st).trim()).filter(Boolean).join(', ');
const parceleOpis = c => koji(c).length > 1 ? koji(c).map(k => `k.o. ${k}: parc. št. ${parceleTxt(c, k)}`).join('; ') : join([koTxt(c) && 'k.o. ' + koTxt(c), parceleTxt(c) && 'parc. št. ' + parceleTxt(c)]);
const osebaIme = o => o.tip === 'po' ? (o.naziv || '') : join([o.ime, o.priimek], ' ');
// Vse osebe: uporabnik (id 'u') in drugi lastniki.
const osebe = c => [{ id: 'u', ...c.im, jeUporabnik: true }, ...c.lastniki];
const parceleOd = (c, id) => parc(c).filter(x => x.lastniki && x.lastniki[id]);
// Podpisniki pooblastil: uporabnik vedno, drugi lastniki, če imajo označeno vsaj eno parcelo.
const podpisniki = c => osebe(c).filter(o => o.jeUporabnik || parceleOd(c, o.id).length);
const vecLastnikov = c => parc(c).some(x => Object.values(x.lastniki || {}).filter(Boolean).length > 1) || podpisniki(c).length > 1;
const obrTxt = o => join(Object.keys(OPC.obratovanje).filter(k => o && o[k]).map(k => OPC.obratovanje[k]), ' · ');
const obrCb = p => `<div style="grid-column:1/-1;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)">Način obratovanja (obkljukajte kot na obrazcu)<div class="row" style="gap:6px 18px;color:var(--fg)">${Object.entries(OPC.obratovanje).map(([k, t]) => cb(`${p}.${k}`, t)).join('')}</div></div>`;

/* ---------- izračuni ---------- */
const R = () => S.rules;
const uporabnik = c => c.im.tip === 'po' ? (c.im.naziv || '') : join([c.im.ime, c.im.priimek], ' ');
const naslov = (o) => join([join([o.ulica, o.hs], ' '), o.posta]);
const lok = c => c.mm.enako ? c.im : c.mm;
const lokacija = c => naslov(lok(c));
const kos = x => Math.max(1, Math.round(num(x.kos) || 1));
const napetost = x => num(x.napetost) || (x.faze === '1f' ? 230 : 400);
function moci(c) {
  const rs = c.rs.filter(r => r.model || num(r.kva)), hee = c.vrste.f ? c.hee.filter(h => h.model || num(h.kwh)) : [];
  const kva = rs.reduce((a, r) => a + num(r.kva) * kos(r), 0);
  const kwp = num(c.el.panelKos) * num(c.el.panelWp) / 1000;
  const heeKwh = hee.reduce((a, h) => a + num(h.kwh) * kos(h), 0);
  const heeP = hee.reduce((a, h) => a + num(h.kwP) * kos(h), 0);
  const heeO = hee.reduce((a, h) => a + num(h.kwO || h.kwP) * kos(h), 0);
  const letno = num(c.el.letno), lastne = Math.min(num(c.el.lastne), letno);
  return { rs, hee, kva, kwp, heeKwh, heeP, heeO, letno, lastne, oddaja: Math.max(0, letno - lastne) };
}
const ocenaLetno = c => Math.round(moci(c).kwp * num(R().letniDonos));
const ocenaLastne = c => Math.round(num(c.el.letno || ocenaLetno(c)) * num(R().delezLastne) / 100);
function napravaTxt(c) {
  const m = moci(c);
  return join([
    'sončna elektrarna' + (m.kwp ? ` ${fmtN(m.kwp)} kWp` : ''),
    m.rs.length ? 'razsmernik ' + m.rs.map(r => `${kos(r) > 1 ? kos(r) + ' × ' : ''}${join([r.proizvajalec, r.model], ' ')}`).join(' + ') + (m.kva ? ` (${fmtN(m.kva)} kVA)` : '') : '',
    m.hee.length ? `hranilnik ${m.hee.map(h => `${kos(h) > 1 ? kos(h) + ' × ' : ''}${join([h.proizvajalec, h.model], ' ')}`).join(' + ')}${m.heeKwh ? ` (${fmtN(m.heeKwh)} kWh)` : ''}` : ''
  ]);
}
function opombeAuto(c) {
  const m = moci(c), iz = S.izvajalec;
  return join([
    `Naprava za individualno samooskrbo (${c.el.shema}): ${napravaTxt(c)}.`,
    `Vlogo oddaja pooblaščenec ${iz.naziv}${join([iz.kontakt, iz.tel, iz.email]) ? ` (${join([iz.kontakt, iz.tel, iz.email])})` : ''}.`
  ], ' ');
}
const opombe = c => c.opombeRocno ? c.opombe : opombeAuto(c);
// Število za kopiranje v spletni obrazec.
const cn = (v, d = 2) => { if (v === '' || v == null) return ''; const s = fmtN(num(v), d); return R().decimalka === '.' ? s.replace(',', '.') : s; };
const cz = (v, d) => num(v) ? cn(v, d) : ''; // prazno namesto 0
const fileBase = c => slug(c.im.tip === 'po' ? c.im.naziv : c.im.priimek || uporabnik(c)) || 'vloga';
const fs = c => FILES[c.id] || {};

/* ---------- kontrole ---------- */
function checks(c) {
  const out = [], e = t => out.push(['err', t]), w = t => out.push(['warn', t]);
  const m = moci(c), im = c.im, mm = c.mm, L = lok(c), f = fs(c), iz = S.izvajalec;
  if (!c.vrste.d && !c.vrste.f) e('Izberite vrsto vloge (elektrarna in/ali hranilnik).');
  if (im.tip === 'po') { if (!im.naziv) e('Manjka naziv uporabnika.'); }
  else if (!im.ime || !im.priimek) e('Manjka ime ali priimek uporabnika.');
  if (!im.ulica || !im.hs) e('Manjka naslov uporabnika (ulica in hišna številka).');
  if (!postaRaz(im.posta).st) e('Pošta uporabnika: vpišite poštno številko in kraj (npr. 2230 Lenart).');
  if (!im.davcna) e('Manjka davčna številka uporabnika (na spletnem obrazcu je obvezna).');
  else if (!davcnaOk(im.davcna)) e('Davčna številka uporabnika ni veljavna.');
  c.lastniki.forEach((l, i) => {
    if (!osebaIme(l)) e(`Lastnik ${i + 2}: manjka ime in priimek.`);
    else if (!parceleOd(c, l.id).length) w(`${osebaIme(l)} nima označene nobene parcele – ne dobi pooblastila.`);
    if (l.davcna && !davcnaOk(l.davcna)) e(`${osebaIme(l) || 'Lastnik ' + (i + 2)}: davčna številka ni veljavna.`);
  });
  if (R().kontaktNas) { if (!iz.tel || !iz.email) e('V nastavitvah vpišite telefon in e-pošto (kontaktni podatki v vlogi).'); }
  else if (!im.tel || !im.email) e('Manjka telefon ali e-pošta uporabnika (kontaktni podatki v vlogi).');
  if (!iz.naziv || !iz.ulica || !iz.hs || !postaRaz(iz.posta).st) e('V nastavitvah dopolnite naziv in naslov pooblaščenca.');
  if (!davcnaOk(iz.davcna)) e('V nastavitvah vpišite veljavno davčno številko pooblaščenca.');
  if (!mm.obstojece) w('Novo merilno mesto: spletni obrazec bo zahteval še vlogo za odjemalca (prvi zavihek) – tega orodje ne pripravi.');
  else if (!/^4-\d+$/.test(mm.st.replace(/\s/g, ''))) e('Številka merilnega mesta mora biti oblike 4-… (z računa za elektriko).');
  if (mm.gsrn && !gs1Ok(mm.gsrn)) e('GSRN merilnega mesta ni veljaven (18 števk, kontrolna števka se ne ujema).');
  if (!mm.enako && (!mm.ulica || !mm.hs || !postaRaz(mm.posta).st)) e('Manjka naslov lokacije naprave.');
  if (!parc(c).length) e('Vpišite parcelo (katastrska občina in parcelna številka).');
  parc(c).forEach((x, i) => {
    if (!String(x.ko).trim()) e(`Parcela ${i + 1}: manjka katastrska občina.`);
    if (!String(x.st).trim()) e(`Parcela ${i + 1}: manjka parcelna številka.`);
    if (!Object.values(x.lastniki || {}).some(Boolean)) w(`Parcela ${x.st || i + 1}: označite lastnika.`);
  });
  const nPod = podpisniki(c).length, nPodpisanih = (f.pooblastilo || []).length;
  if (nPod > 1 && nPodpisanih && nPodpisanih < nPod) w(`Podpisanih pooblastil je ${nPodpisanih}, podpisnikov pa ${nPod}.`);
  if (!num(mm.pmOdjem)) w('Vpišite priključno moč odjema merilnega mesta (kW) – z računa ali iz soglasja (npr. 17 kW pri 3 × 25 A).');
  if (c.vrste.d) {
    if (!m.rs.length) e('Vpišite razsmernik.');
    m.rs.forEach((r, i) => { if (!num(r.kva)) e(`Razsmernik ${i + 1}: manjka moč (kVA).`); });
    if (!m.kwp) w('Vpišite FN module (število in moč) – moč FN modulov je na obrazcu.');
    if (!num(c.el.pmNova)) e('Vpišite novo priključno moč proizvodne naprave (kW).');
    if (num(mm.pmOdjem) && m.kva > num(mm.pmOdjem)) e(`Moč razsmernikov (${fmtN(m.kva)} kVA) presega priključno moč odjema (${fmtN(num(mm.pmOdjem))} kW) – naprava za samooskrbo je ne sme.`);
    if (num(mm.pmOdjem) && num(c.el.pmNova) > num(mm.pmOdjem)) e(`Nova priključna moč (${cn(c.el.pmNova)} kW) presega priključno moč odjema (${fmtN(num(mm.pmOdjem))} kW).`);
    if (m.kva && num(c.el.pmNova) > m.kva + 0.01) w('Nova priključna moč je večja od moči razsmernikov – preverite.');
    if (!obrTxt(c.el.obr)) e('Elektrarna: obkljukajte način obratovanja.');
    if (!m.letno) w('Vpišite predvideno letno proizvodnjo (gumb ≈ jo oceni).');
    else if (!num(c.el.lastne)) w('Vpišite predvideno letno proizvodnjo za lastne potrebe.');
    if (m.kwp && m.kva && m.kwp / m.kva > 1.5) w(`Razmerje FN moduli / razsmernik je ${fmtN(m.kwp / m.kva, 2)} – preverite podatke.`);
  }
  if (c.vrste.f) {
    if (!m.hee.length) e('Vpišite hranilnik.');
    m.hee.forEach((h, i) => {
      if (!num(h.kwh)) e(`Hranilnik ${i + 1}: manjka kapaciteta (kWh).`);
      if (!num(h.kwP)) e(`Hranilnik ${i + 1}: manjka moč polnjenja (kW).`);
    });
    if (new Set(m.hee.map(h => h.tehnologija)).size > 1) w('Hranilniki imajo različne tehnologije – na obrazcu je ena izbira.');
    if (new Set(m.hee.map(h => h.faze)).size > 1) w('Hranilniki imajo različno število faz – na obrazcu je ena izbira.');
    if (!obrTxt(c.hr.obr)) e('Hranilnik: obkljukajte način obratovanja.');
    if (!num(mm.pmOdjem)) e('Hranilnik: obrazec zahteva priključno moč (kW) – vpišite priključno moč odjema merilnega mesta.');
  }
  if (!(f.pooblastilo || []).length) w('Podpisano pooblastilo še ni dodano (obvezna priloga).');
  if (!(f.enopolna || []).length) w('Enopolna shema še ni dodana (del tehnične dokumentacije).');
  if (!(f.listi || []).length) w('Tehnični listi opreme še niso dodani.');
  for (const [k, list] of Object.entries(f)) for (const x of list) {
    if (['pooblastilo', 'kataster', 'ostalo'].includes(k) && x.size > MAX_DAT) e(`»${x.name}« ima ${fmtMB(x.size)} – spletni obrazec sprejme največ 4 MB.`);
  }
  if (TEHDOC[c.id] && TEHDOC[c.id].size > MAX_DAT) e(`Tehnična dokumentacija ima ${fmtMB(TEHDOC[c.id].size)} (največ 4 MB) – zmanjšajte tehnične liste ali jih dajte med ostala dokazila.`);
  if (!out.some(x => x[0] === 'err')) out.push(['ok', out.length ? 'Ni blokirajočih napak.' : 'Vse je pripravljeno za oddajo.']);
  return out;
}

/* ---------- pomočnik za oddajo: koraki spletnega obrazca ---------- */
// Vrstica: { l: oznaka na obrazcu, v: vrednost za kopiranje } ali { l, izb: izbira } ali { l, dat: [...] } ali { sub: naslov } ali { info }.
// r: obvezno polje (rdeče, če manjka); h: namig.
function koraki(c) {
  const m = moci(c), im = c.im, mm = c.mm, iz = S.izvajalec, L = lok(c), PO = im.tip === 'po', f = fs(c);
  const ps = postaRaz(im.posta), psIz = postaRaz(iz.posta), psL = postaRaz(L.posta);
  const kontakt = R().kontaktNas ? { o: iz.kontakt || iz.zastopnik, t: iz.tel, e: iz.email } : { o: uporabnik(c), t: im.tel, e: im.email };
  const mmSt = mm.st.replace(/\s/g, '').replace(/^4-/, '');
  const datRow = (l, keys, h, r) => ({ l, dat: keys.flatMap(k => (f[k] || []).map(x => x.name)), r, h });
  const tehRow = l => ({ l, teh: true, r: true, h: 'Prenesite PDF tehnične dokumentacije in ga naložite v to polje.' });
  const out = [];

  out.push({ n: 'Pričetek', v: [
    { sub: 'Osnovni podatki' },
    { l: 'Oddaje enotne vloge za', izb: join([c.vrste.d && '4. … proizvodne naprave EE / naprave za individualno samooskrbo …', c.vrste.f && '6. … za hranilnik električne energije'], ' in '), h: 'Obe možnosti lahko obkljukate hkrati.', r: true },
    { l: 'Dodatni podatki potrebni za izdajo soglasja', izb: R().dodatniPodatki || '', r: true, h: R().dodatniPodatki ? '' : 'Izberite ustrezno možnost. Če je vedno ista, jo vpišite v Nastavitve → Pravila.' },
    { sub: 'Uporabnik ali pooblaščenec' },
    { l: 'Vaša vloga', izb: 'Sem pooblaščenec – vlogo oddajam za drugega uporabnika' }
  ] });

  const u = [
    { sub: 'Podatki o uporabniku' },
    { l: 'Vrsta uporabnika', izb: PO ? 'Pravni subjekt' : 'Fizična oseba' },
    { l: 'Ali ima nepremičnina več solastnikov', izb: vecLastnikov(c) ? 'Da' : 'Ne', h: vecLastnikov(c) ? `Pooblastila podpišejo: ${podpisniki(c).map(osebaIme).join(', ')}.` : '' },
    ...(PO ? [{ l: 'Naziv', v: im.naziv, r: true, h: 'Polja za pravni subjekt preverite na obrazcu.' }] : [{ l: 'Priimek', v: im.priimek, r: true }, { l: 'Ime', v: im.ime, r: true }]),
    { l: 'Kraj', v: im.kraj, h: 'Neobvezno – naselje, če je drugačno od pošte.' },
    { l: 'Naslov (ulica/naselje)', v: im.ulica, r: true },
    { l: 'Hišna številka', v: im.hs, r: true },
    { l: 'Pošta', v: ps.st, r: true, h: ps.st ? `Iskalnik: vtipkajte ${ps.st} in izberite »${join([ps.st, ps.kraj], ' ')}«.` : '' },
    { l: 'Davčna številka', v: String(im.davcna || '').replace(/\D/g, ''), r: true },
    ...(PO ? [{ l: 'Davčni zavezanec', izb: im.zavezanec ? 'Da' : 'Ne', h: 'Če se pojavi.' }] : []),
    { sub: 'Podatki o pooblaščencu' },
    { l: 'Vrsta pooblaščenca', izb: 'Pravni subjekt' },
    { l: 'Naziv', v: iz.naziv, r: true },
    { l: 'Kraj', v: iz.kraj },
    { l: 'Naslov (ulica/naselje)', v: iz.ulica, r: true },
    { l: 'Hišna številka', v: iz.hs, r: true },
    { l: 'Pošta', v: psIz.st, r: true, h: psIz.st ? `Iskalnik: vtipkajte ${psIz.st} in izberite »${join([psIz.st, psIz.kraj], ' ')}«.` : '' },
    { l: 'Davčna številka', v: iz.davcna, r: true },
    { sub: 'Kontaktni podatki' },
    { l: 'Podatki o kontaktni osebi so enaki podatkom o uporabniku', izb: R().kontaktNas ? 'izklopljeno' : 'vklopljeno', h: R().kontaktNas ? 'Kontakt smo mi – potrdilo in številka vloge prideta na naš e-naslov.' : '' },
    ...(R().kontaktNas ? [{ l: 'Kontaktna oseba', v: kontakt.o, r: true }, { l: 'Telefon', v: kontakt.t, r: true }, { l: 'E-mail', v: kontakt.e, r: true }] : []),
    { sub: 'Priloge' },
    datRow('Pooblastilo investitorja', ['pooblastilo'], podpisniki(c).length > 1 ? `Naložite vsa podpisana pooblastila (${podpisniki(c).length}), vsako največ 4 MB.` : 'Podpisano pooblastilo (največ 4 MB).', true)
  ];
  out.push({ n: 'Podatki o uporabniku', v: u });

  out.push({ n: 'Podatki o plačniku stroškov priključevanja', v: [
    { l: 'Plačnik stroškov priključevanja', izb: c.plTretja ? 'Plačnik stroškov bo tretja oseba' : 'Plačnik stroškov bo uporabnik', h: c.plTretja ? 'Podatke plačnika vpišite ročno.' : '' }
  ] });

  const lokVrst = (gumb) => c.mm.enako
    ? [{ l: gumb, izb: 'kliknite (Kopiraj/Prenesi)', h: 'Lokacija je na naslovu uporabnika.' }]
    : [{ l: 'Kraj', v: L.kraj }, { l: 'Naslov (ulica/naselje)', v: L.ulica, r: true }, { l: 'Hišna številka', v: L.hs, r: true },
       { l: 'Pošta', v: psL.st, r: true, h: psL.st ? `Iskalnik: vtipkajte ${psL.st} in izberite »${join([psL.st, psL.kraj], ' ')}«.` : '' }];
  // Katastrska občina in parcele: prva KO v glavna polja, ostale po vklopu stikala.

  const koVrst = [

    { l: 'Objekt se nahaja v več kot eni katastrski občini', izb: kk.length > 1 ? 'vklopljeno' : 'izklopljeno', h: kk.length > 1 ? 'Za ostale KO se pojavijo dodatna polja – preverite.' : '' },
    ...kk.slice(1).flatMap(k => [{ l: 'Katastrska občina (dodatna)', v: k, r: true }, { l: 'Parcelna številka', v: parceleTxt(c, k), r: true }])
  ];
  const mmVrst = [
    { l: 'Sprememba na obstoječem merilnem mestu', izb: mm.obstojece ? 'vklopljeno' : 'izklopljeno', h: mm.obstojece ? '' : 'Obrazec bo opozoril, da je treba izpolniti še vlogo za odjemalca.' },
    ...(mm.obstojece ? [
      { l: 'Številka merilnega mesta', v: mmSt, r: true, h: 'Polje že vsebuje »4-«, zato se kopira samo ostanek.' },
      { l: 'GSRN MM', v: mm.gsrn.replace(/\s/g, ''), h: 'Neobvezno – izpolnite, če obstaja.' }] : [])
  ];

  if (c.vrste.d) {
    const el = c.el;
    out.push({ n: 'Podatki o elektrarni oz. proizvodni napravi', v: [
      ...mmVrst,
      { l: 'Naziv elektrarne oz. proizvodne naprave', v: el.naziv || R().nazivNaprave, r: true },
      { l: 'Številka predhodno izdane informacije o možnosti priključitve ali soglasja', v: mm.predhodna, h: 'Neobvezno – npr. informacija iz portala Moj Elektro.' },
      { l: 'Vrsta proizvodne naprave', izb: R().vrstaNaprave, r: true, h: 'Izberite to ali najbližjo možnost.' },
      { l: 'Proizvodni vir energije', izb: OPC.vir[el.vir], r: true },
      { l: 'Moč fotonapetostnih modulov (kW)', v: cz(m.kwp, 3), h: 'Polje se pojavi po izbiri vira »sonce«.' },
      ...lokVrst('Podatki o lokaciji so enaki uporabnikovemu naslovu'),
      ...koVrst,
      { l: 'Predvideno leto priključitve', izb: mm.leto, r: true },
      { sub: 'Priključna moč proizvodne naprave' },
      { l: 'Obstoječa (kW)', v: cn(el.pmObstojeca || 0), r: true },
      { l: 'Nova (kW)', v: cz(el.pmNova), r: true },
      { l: 'Celotna instalirana moč proizvodne naprave (kVA)', v: cz(m.kva), r: true },
      { sub: 'Tehnični podatki' },
      { l: 'Način vključevanja v DS tipska shema', izb: OPC.shema[el.shema], r: true },
      { l: 'Način obratovanja', izb: obrTxt(el.obr), pre: 'Obkljukajte', r: true, h: 'Potrditvena polja – obkljukajte samo navedeno.' },
      { l: 'Na voljo za sistemske storitve', izb: el.sistemske ? 'Da' : 'Ne' },
      ...m.rs.flatMap((r, i) => [
        { sub: `Razsmernik ${m.rs.length > 1 ? i + 1 + ' ' : ''}– gumb »Dodaj« (${join([r.proizvajalec, r.model], ' ')})` },
        { l: 'Generator / Razsmernik', izb: 'Razsmernik' },
        { l: 'Število enakih enot', v: String(kos(r)), r: true },
        { l: 'Moč enote (kVA)', v: cz(r.kva), r: true },
        { l: 'Nazivna napetost (V)', v: String(napetost(r)), r: true },
        { l: 'Vrsta generatorja/razsmernika', izb: 'fotonapetostni' },
        { l: 'Število faz', izb: OPC.faze[r.faze] || r.faze }
      ]),
      { sub: 'Predvidena letna proizvodnja' },
      { l: 'Za lastne potrebe (kWh)', v: m.letno ? String(Math.round(m.lastne)) : '', r: true },
      { l: 'Za oddajo v omrežje EES (kWh)', v: m.letno ? String(Math.round(m.oddaja)) : '', r: true },
      { l: 'Predvidena letna proizvodnja (kWh)', v: m.letno ? String(Math.round(m.letno)) : '', h: 'Obrazec jo izračuna sam (ikona kalkulatorja) – preverite.' },
      { sub: 'Priloge' },
      tehRow('Gradbeno dovoljenje ali tehnična dokumentacija za izvedbo elektrarne'),
      datRow('Kopija katastrskega načrta in zazidalna situacija', ['kataster'], 'Neobvezno.'),
      datRow('Ostala dokazila', ['ostalo'], 'Neobvezno.')
    ] });

function manjka(c) {
  const im = c.im, mm = c.mm, out = [];
  if (!im.davcna) out.push('vašo davčno številko');
  if (mm.obstojece && !/^4-\d+$/.test(mm.st.replace(/\s/g, ''))) out.push('številko merilnega mesta (oblika 4-…, je na računu za elektriko)');
  if (!mm.gsrn) out.push('GSRN kodo merilnega mesta (18 števk, je na računu za elektriko), če jo imate pri roki');
  if (!koTxt(c) || !parceleTxt(c)) out.push('katastrsko občino in parcelne številke (in kdo je lastnik posamezne parcele)');
  if (!num(mm.pmOdjem)) out.push('priključno moč merilnega mesta (na računu za elektriko)');
  return out;
}
function fill(tpl, c) {
  const iz = S.izvajalec, mk = manjka(c);
  const vars = {
    uporabnik: uporabnik(c), naslov: naslov(c.im), lokacija: lokacija(c) || '—', mm: c.mm.st && c.mm.st !== '4-' ? c.mm.st : '—',
    naprava: napravaTxt(c) || '—', distributer: DIST.ime,
    st_vloge: c.oddaja.st ? `, številka vloge ${c.oddaja.st}` : '',
    blok_solastniki: podpisniki(c).length > 1 ? `\nKer je lastnikov več, je v priponki za vsakega svoje pooblastilo – vsak naj podpiše svoje:\n${podpisniki(c).map(o => `  • ${osebaIme(o)}${parceleOd(c, o.id).length ? ` (parc. št. ${parceleOd(c, o.id).map(x => x.st).join(', ')})` : ''}`).join('\n')}` : '',
    blok_manjka: mk.length ? `Pošljite nam še:\n${mk.map(x => '  • ' + x).join('\n')}` : '',
    izvajalec: iz.naziv, podpis: iz.podpis || iz.naziv
  };
  return String(tpl).replace(/\{\{(\w+)\}\}/g, (mt, key) => key in vars ? vars[key] : mt).replace(/\n{3,}/g, '\n\n');
}

function updateDerived() {
  const c = cur(); if (!c) return;
  const m = moci(c), ch = checks(c);
  const kk = koraki(c), vse = kk.flatMap(k => k.v).filter(x => !x.sub && !x.info), ok = vse.filter(x => c.done[x.k]).length;
  const aside = $('#aside'); if (!aside) return;
  const oc = ocene(c);
  osebe(c).forEach((o, j) => document.querySelectorAll(`[data-ime="${o.id}"]`).forEach(el => { el.textContent = osebaIme(o) || (j ? 'lastnik ' + (j + 1) : 'uporabnik'); }));
  if ($('#podpisnikiTxt')) $('#podpisnikiTxt').textContent = podpisniki(c).map(o => osebaIme(o) || '(brez imena)').join(', ');
  document.querySelectorAll('[data-ocena]').forEach(el => { el.innerHTML = oceniBtn(el.dataset.ocena, oc[el.dataset.ocena]); });
  if ($('#oddajaKwh')) $('#oddajaKwh').value = m.letno ? Math.round(m.oddaja) : '';
  aside.innerHTML = `
    <div class="card"><div class="muted small">Naprava</div><div class="big">${m.kwp ? fmtN(m.kwp) + ' kWp' : m.kva ? fmtN(m.kva) + ' kVA' : '—'}</div>
      <dl class="kv" style="margin-top:8px">
        ${m.kva ? `<dt>Razsmerniki</dt><dd>${fmtN(m.kva)} kVA</dd>` : ''}
        ${m.heeKwh ? `<dt>Hranilnik</dt><dd>${fmtN(m.heeKwh)} kWh, ${fmtN(m.heeP)} kW</dd>` : ''}
        <dt>Priključna moč odjema</dt><dd>${c.mm.pmOdjem ? cn(c.mm.pmOdjem) + ' kW' : '—'}</dd>
        ${c.vrste.d ? `<dt>Nova moč oddaje</dt><dd>${c.el.pmNova ? cn(c.el.pmNova) + ' kW' : '—'}</dd>` : ''}
        <dt>Oddaja na spletu</dt><dd>${ok} / ${vse.length}</dd>
      </dl>
      <button class="pri" style="margin-top:10px;width:100%;justify-content:center" data-act="view" data-v="oddaja">Oddaja na spletu →</button></div>
    <div class="card"><h2>Kontrole</h2><ul class="chk">${ch.map(([l, t]) => `<li class="${l}">${esc(t)}</li>`).join('')}</ul></div>`;

  if (subj && t && document.activeElement !== body) { $('#mailTo').value = c.im.email || '(ni vpisan)'; subj.value = fill(t.zadeva, c); body.value = fill(t.telo, c); }
}

function renderOddaja() {
  const c = cur(), kk = koraki(c), ch = checks(c).filter(x => x[0] === 'err');
  const open = state.korak ?? kk.findIndex(k => k.v.some(x => !x.sub && !x.info && !c.done[x.k]));
  app.innerHTML = `<div class="wiz">
  <div class="row" style="margin-bottom:10px">
    <button data-act="view" data-v="edit">← Podatki</button>
    <h1 style="margin:0 0 0 6px">${esc(uporabnik(c) || 'Vloga')} – oddaja na spletu</h1>

  ${kk.map((k, i) => {
    const vr = k.v.filter(x => !x.sub && !x.info), ok = vr.filter(x => c.done[x.k]).length, done = vr.length ? ok === vr.length : !!c.done[`korak${i}`];
    return `<details class="card korak${done ? ' done' : ''}" data-korak="${i}"${i === open ? ' open' : ''}>
      <summary><span class="num">${done ? '✓' : i + 1}</span>${esc(k.n)}<span class="prog">${vr.length ? `${ok} / ${vr.length}` : ''}</span></summary>
      ${k.v.map(x => vrstica(c, x)).join('')}

function vrstica(c, x) {
  if (x.sub) return `<div class="vr sub"><span></span><span class="lab" style="grid-column:2/5">${esc(x.sub)}</span></div>`;
  if (x.info) return `<div class="vr"><span>ℹ️</span><span class="small" style="grid-column:2/5">${esc(x.info)}</span></div>`;
  const ok = !!c.done[x.k], miss = x.r && rowEmpty(x);
  let val, btn = '';
  if (x.teh) {
    const td = TEHDOC[c.id];
    val = td ? `naložite <b>${esc(td.name)}</b> <span class="${td.size > MAX_DAT ? 'bad' : 'muted'}">(${fmtMB(td.size)})</span>` : '<span class="bad">tehnična dokumentacija še ni pripravljena</span>';
    btn = `<button class="sm" data-act="tehDl"${pdfReady() ? '' : ' disabled'}>${td ? 'Prenesi' : 'Pripravi'}</button>`;
  } else if (x.dat) {
    val = x.dat.length ? 'naložite: <b>' + x.dat.map(esc).join(', ') + '</b>' : (x.r ? '— datoteka še ni dodana v orodje' : '<span class="muted">— (neobvezno)</span>');
  } else if ('izb' in x) {
    val = x.izb ? `${x.pre || 'Izberite'}: <span class="izb">${esc(x.izb)}</span>` : (x.r ? '— izberite na obrazcu' : '—');
  } else {
    val = String(x.v ?? '').trim() ? esc(x.v) : (x.r ? '— manjka' : '<span class="muted">—</span>');
    if (String(x.v ?? '').trim()) btn = `<button class="sm" data-act="cp" data-k="${esc(x.k)}">Kopiraj</button>`;
  }
  return `<div class="vr${ok ? ' ok' : ''}${miss ? ' miss' : ''}">
    <input type="checkbox" data-act="done" data-k="${esc(x.k)}"${ok ? ' checked' : ''} title="Opravljeno">
    <span class="lab">${esc(x.l)}${x.r ? ' *' : ''}</span><span class="val">${val}</span><span>${btn}</span>
    ${x.h ? `<span class="hint">${esc(x.h)}</span>` : ''}</div>`;
}

/* ---------- dogodki ---------- */
function onField(e) {
  const t = e.target;
  if (t.dataset.p && cur()) {
    const c = cur();
    setPath(c, t.dataset.p, t.type === 'checkbox' ? t.checked : t.value);
    c.updated = today(); saveCases();
    if (/^(rs|hee|el|im|mm|parcele)\./.test(t.dataset.p)) delete TEHDOC[c.id];
    if (t.dataset.full) renderEdit(); else updateDerived();
  } else if (t.dataset.s) {
    setPath(S, t.dataset.s, t.type === 'checkbox' ? t.checked : (t.type === 'number' ? num(t.value) : t.value));
    saveSettings();
  }
}
app.addEventListener('input', e => { if (e.target.type !== 'checkbox' && e.target.tagName !== 'SELECT' && !e.target.dataset.act) onField(e); });
app.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.act === 'katRs' || t.dataset.act === 'katHee') {
    const rs = t.dataset.act === 'katRs', k = S.katalog[rs ? 'razsmerniki' : 'hranilniki'][+t.value], c = cur(); if (!k) return;
    Object.assign(c[rs ? 'rs' : 'hee'][+t.dataset.i], clone(k));
    c.updated = today(); delete TEHDOC[c.id]; saveCases(); renderEdit(); return;
  }
  if (t.dataset.act === 'file') {
    const c = cur(), f = (FILES[c.id] ||= {});
    f[t.dataset.k] = [...(f[t.dataset.k] || []), ...t.files];
    if (['enopolna', 'listi'].includes(t.dataset.k)) delete TEHDOC[c.id];
    renderEdit(); return;
  }
  if (t.dataset.act === 'done') {
    const c = cur(); if (t.checked) c.done[t.dataset.k] = true; else delete c.done[t.dataset.k];
    saveCases(); state.korak = +t.closest('[data-korak]').dataset.korak; renderOddaja(); return;
  }
  if (t.type === 'checkbox' || t.tagName === 'SELECT') onField(e);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && PV) closePreview(); });
app.addEventListener('toggle', e => { if (e.target.dataset && e.target.dataset.korak != null && e.target.open) state.korak = +e.target.dataset.korak; }, true);

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'SELECT' || b.type === 'file' || b.type === 'checkbox') return;
  const act = b.dataset.act, c = cur();
  if (act !== 'open') e.stopPropagation();
  switch (act) {
    case 'view': e.preventDefault(); state.view = b.dataset.v; state.korak = undefined; render(); window.scrollTo(0, 0); break;
    case 'new': { const n = newCase(); CASES.push(n); saveCases(); state = { view: 'edit', id: n.id, tpl: null }; render(); break; }
    case 'open': if (e.target.closest('button')) break; state = { view: 'edit', id: b.dataset.id, tpl: null }; render(); window.scrollTo(0, 0); break;
    case 'del': {
      const x = CASES.find(y => y.id === b.dataset.id);
      if (confirm(`Izbrišem vlogo »${uporabnik(x) || 'brez imena'}«?`)) { CASES = CASES.filter(y => y.id !== x.id); delete FILES[x.id]; delete TEHDOC[x.id]; lsSet(LS_CASES, CASES); render(); }
      break;
    }
    case 'addParc': c.parcele.push(newParcela(c.parcele.length ? c.parcele[c.parcele.length - 1].ko : '')); saveCases(); renderEdit(); break;
    case 'delParc': c.parcele.splice(+b.dataset.i, 1); if (!c.parcele.length) c.parcele.push(newParcela()); delete TEHDOC[c.id]; saveCases(); renderEdit(); break;
    case 'addLast': { const l = newLastnik(); c.lastniki.push(l); c.parcele.forEach(x => { (x.lastniki ||= {})[l.id] = true; }); saveCases(); renderEdit(); break; }
    case 'delLast': { const [l] = c.lastniki.splice(+b.dataset.i, 1); c.parcele.forEach(x => { if (x.lastniki) delete x.lastniki[l.id]; }); saveCases(); renderEdit(); break; }
    case 'addRs': c.rs.push(newRs()); saveCases(); renderEdit(); break;
    case 'delRs': c.rs.splice(+b.dataset.i, 1); delete TEHDOC[c.id]; saveCases(); renderEdit(); break;
    case 'addHee': c.hee.push(newHee()); saveCases(); renderEdit(); break;
    case 'delHee': c.hee.splice(+b.dataset.i, 1); delete TEHDOC[c.id]; saveCases(); renderEdit(); break;
    case 'oceniLetno': c.el.letno = String(ocenaLetno(c)); saveCases(); renderEdit(); break;
    case 'oceniLastne': c.el.lastne = String(ocenaLastne(c)); saveCases(); renderEdit(); break;
    case 'oceniPm': c.el.pmNova = String(ocene(c).oceniPm[0]); saveCases(); renderEdit(); break;
    case 'clrFiles': delete fs(c)[b.dataset.k]; if (['enopolna', 'listi'].includes(b.dataset.k)) delete TEHDOC[c.id]; renderEdit(); break;
    case 'genPoob': showPdf(c, 'poob'); break;
    case 'genTeh': showPdf(c, 'teh'); break;
    case 'tehDl': {
      if (!TEHDOC[c.id]) { const ok = await pripraviTeh(c); if (!ok) break; }
      download(TEHDOC[c.id].name, new Blob([TEHDOC[c.id].bytes], { type: 'application/pdf' }));
      renderOddaja(); break;
    }
    case 'cp': {
      const x = koraki(c).flatMap(k => k.v).find(y => y.k === b.dataset.k); if (!x) break;
      await copyText(String(x.v)); c.done[x.k] = true; saveCases();
      state.korak = +b.closest('[data-korak]').dataset.korak; renderOddaja(); toast(`Kopirano: ${String(x.v).slice(0, 60)}`);
      break;
    }
    case 'resetDone': if (confirm('Počistim vse kljukice?')) { c.done = {}; saveCases(); state.korak = undefined; renderOddaja(); } break;
    case 'tpl': state.tpl = b.dataset.t; renderEdit(); break;
    case 'copyMail': await copyText($('#mailBody').value); toast('Besedilo kopirano.'); break;
    case 'mailto': location.href = `mailto:${encodeURIComponent(c.im.email || '')}?subject=${encodeURIComponent($('#mailSubj').value)}&body=${encodeURIComponent($('#mailBody').value)}`; break;
    case 'vPriklop': izvoziPriklop(c); break;
    case 'enoCp': await copyText(besediloEnopolna(c)); toast('Podatki za enopolno shemo kopirani.'); break;
    case 'enoTxt': download(`${fileBase(c)}_podatki_enopolna.txt`, besediloEnopolna(c), 'text/plain;charset=utf-8'); break;
    case 'enoJson': download(`${fileBase(c)}_podatki_enopolna.json`, JSON.stringify(podatkiEnopolna(c), null, 2), 'application/json'); break;
    case 'pvDl': if (PV) { if (PV.zip) download(PV.zip, zipBlob(PV.files.map(x => ({ name: x.name, data: x.bytes })))); else download(PV.files[0].name, new Blob([PV.files[0].bytes], { type: 'application/pdf' })); } break;
    case 'pvClose': closePreview(); break;
    case 'katAdd': S.katalog[b.dataset.k].push(b.dataset.k === 'razsmerniki' ? { proizvajalec: '', model: '', kva: '', faze: '3f' } : { proizvajalec: '', model: '', tehnologija: 'LFP', kwh: '', kwP: '', kwO: '', faze: '3f' }); saveSettings(); renderSettings(); break;
    case 'katDel': S.katalog[b.dataset.k].splice(+b.dataset.i, 1); saveSettings(); renderSettings(); break;
    case 'importKat': $('#importKat').click(); break;
    case 'export': download(`vloge-soglasje-${today()}.json`, JSON.stringify({ orodje: 'vloga-za-soglasje', verzija: 1, izvoz: today(), nastavitve: S, vloge: CASES }, null, 2), 'application/json'); break;
    case 'import': $('#importFile').click(); break;
    case 'resetRules':
      if (confirm('Ponastavim pravila in predloge e-pošte na privzete? Podatki pooblaščenca, katalog in vloge ostanejo.')) {
        S.rules = clone(DEFAULTS.rules); S.templates = clone(DEFAULTS.templates); saveSettings(); render();
      }
      break;
    case 'wipe':
      if (confirm('Res izbrišem VSE vloge iz tega brskalnika? Najprej naredite izvoz varnostne kopije.')) { CASES = []; lsSet(LS_CASES, CASES); render(); }
      break;
  }
});

$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.vloge) || d.orodje !== 'vloga-za-soglasje') throw 0;
    const known = new Set(CASES.map(c => c.id));
    const add = d.vloge.filter(c => c && c.id && !known.has(c.id)).map(c => merge(newCase(), c));
    const repl = d.nastavitve && confirm(`Datoteka vsebuje ${d.vloge.length} vlog (${add.length} novih). Uvozim tudi nastavitve iz datoteke?`);
    CASES.push(...add); lsSet(LS_CASES, CASES);
    if (repl) { S = merge(DEFAULTS, d.nastavitve); saveSettings(); }
    toast(`Uvoženih vlog: ${add.length}.`); render();
  } catch (err) { toast('Datoteke ni bilo mogoče uvoziti (ni varnostna kopija tega orodja).'); }
});
// Katalog iz varnostne kopije orodja Vloga-priklop (razsmerniki: kva; hranilniki: kwh, kvaP, kvaO).
$('#importKat').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text()), k = (d.nastavitve || d).katalog;
    if (!k) throw 0;
    const key = x => `${x.proizvajalec}|${x.model}`.toLowerCase().trim();
    const imaRs = new Set(S.katalog.razsmerniki.map(key)), imaHee = new Set(S.katalog.hranilniki.map(key));
    const rs = (k.razsmerniki || []).filter(x => !imaRs.has(key(x))).map(x => ({ proizvajalec: x.proizvajalec || '', model: x.model || '', kva: x.kva ?? '', faze: x.faze || '3f', sodo: !!x.sodo }));
    const hee = (k.hranilniki || []).filter(x => !imaHee.has(key(x))).map(x => ({ proizvajalec: x.proizvajalec || '', model: x.model || '', tehnologija: x.tehnologija || 'LFP', kwh: x.kwh ?? '', kwP: x.kwP ?? x.kvaP ?? '', kwO: x.kwO ?? x.kvaO ?? '', faze: x.faze || '3f', sodo: !!x.sodo }));
    S.katalog.razsmerniki.push(...rs); S.katalog.hranilniki.push(...hee); saveSettings(); renderSettings();
    toast(`Dodano: ${rs.length} razsmernikov, ${hee.length} hranilnikov.${hee.length ? ' Preverite tehnologijo in faze.' : ''}`);
  } catch (err) { toast('V datoteki ni kataloga opreme.'); }
});

/* ---------- izvoz podatkov za enopolno shemo (tudi nedokončana vloga) ---------- */
function podatkiEnopolna(c) {
  const m = moci(c), L = lok(c), n = v => num(v) || null, mmSt = c.mm.st.replace(/\s/g, '');
  const d = {
    orodje: 'vloga-za-soglasje', namen: 'podatki za enopolno shemo', izvoz: today(),
    uporabnik: { naziv: uporabnik(c) || null, naslov: naslov(c.im) || null, tel: c.im.tel || null, email: c.im.email || null },
    lokacija: { naslov: lokacija(c) || null, katastrskaObcina: koTxt(c) || null, parcele: parceleTxt(c) || null,
      seznamParcel: parc(c).map(x => ({ ko: x.ko || null, parcela: x.st || null, lastniki: osebe(c).filter(o => x.lastniki && x.lastniki[o.id]).map(osebaIme) })) },
    merilnoMesto: {
      obstojece: !!c.mm.obstojece, stevilka: /^4-\d+$/.test(mmSt) ? mmSt : null, gsrn: c.mm.gsrn.replace(/\s/g, '') || null,
      prikljucnaMocOdjemaKw: n(c.mm.pmOdjem)
    },
    elektrarna: c.vrste.d ? {
      naziv: c.el.naziv || R().nazivNaprave, vir: OPC.vir[c.el.vir], shema: OPC.shema[c.el.shema], nacinObratovanja: obrTxt(c.el.obr) || null,
      fnModuli: { model: c.el.panelModel || null, kos: n(c.el.panelKos), mocWp: n(c.el.panelWp), skupajKwp: m.kwp ? Math.round(m.kwp * 1000) / 1000 : null },
      razsmerniki: m.rs.map(r => ({ proizvajalec: r.proizvajalec || null, model: r.model || null, kos: kos(r), mocKva: n(r.kva), faze: r.faze, napetostV: napetost(r) })),
      instaliranaMocKva: m.kva || null,
      prikljucnaMocOddajeKw: { obstojeca: num(c.el.pmObstojeca), nova: n(c.el.pmNova) },
      letnaProizvodnjaKwh: m.letno ? { skupaj: Math.round(m.letno), lastnePotrebe: Math.round(m.lastne), oddaja: Math.round(m.oddaja) } : null
    } : null,
    hranilnik: c.vrste.f ? {
      shema: OPC.shema[c.hr.shema], nacinObratovanja: obrTxt(c.hr.obr) || null,
      enote: m.hee.map(h => ({ proizvajalec: h.proizvajalec || null, model: h.model || null, kos: kos(h), tehnologija: OPC.tehnologija[h.tehnologija] || h.tehnologija, kapacitetaKwh: n(h.kwh), mocPolnjenjaKw: n(h.kwP), mocPraznjenjaKw: n(h.kwO || h.kwP), faze: h.faze, napetostV: napetost(h) })),
      skupaj: m.hee.length ? { kapacitetaKwh: m.heeKwh, mocPolnjenjaKw: m.heeP, mocPraznjenjaKw: m.heeO } : null
    } : null
  };
  d.manjka = [
    !d.uporabnik.naziv && 'uporabnik', !d.lokacija.naslov && 'naslov lokacije',
    c.mm.obstojece && !d.merilnoMesto.stevilka && 'številka merilnega mesta', !d.merilnoMesto.prikljucnaMocOdjemaKw && 'priključna moč odjema',
    c.vrste.d && !m.kwp && 'FN moduli (število, moč)', c.vrste.d && !m.rs.length && 'razsmernik',
    c.vrste.d && !num(c.el.pmNova) && 'nova priključna moč oddaje', c.vrste.f && !m.hee.length && 'hranilnik'
  ].filter(Boolean);
  return d;
}
function besediloEnopolna(c) {
  const d = podatkiEnopolna(c), e = d.elektrarna, h = d.hranilnik, v = (x, en = '') => x == null || x === '' ? '—' : `${typeof x === 'number' ? fmtN(x, 3) : x}${en}`;
  const L = [`PODATKI ZA ENOPOLNO SHEMO – ${v(d.uporabnik.naziv)}`, `Izvoz: ${fmtD(d.izvoz)}${d.manjka.length ? ' (vloga še ni izpolnjena do konca)' : ''}`, '',
    `Uporabnik: ${v(join([d.uporabnik.naziv, d.uporabnik.naslov]))}`,
    `Lokacija: ${v(d.lokacija.naslov)}`,
    `K.o. / parcele: ${v(parceleOpis(c))}`,
    `Merilno mesto: ${d.merilnoMesto.obstojece ? v(join([d.merilnoMesto.stevilka, d.merilnoMesto.gsrn && 'GSRN ' + d.merilnoMesto.gsrn])) : 'novo merilno mesto'}`,
    `Priključna moč odjema: ${v(d.merilnoMesto.prikljucnaMocOdjemaKw, ' kW')}`];
  if (e) {
    L.push('', 'ELEKTRARNA', `Shema: ${v(e.shema)}`, `Način obratovanja: ${v(e.nacinObratovanja)}`,
      `FN moduli: ${e.fnModuli.kos || e.fnModuli.model ? `${v(e.fnModuli.kos)} × ${v(e.fnModuli.model)} ${v(e.fnModuli.mocWp, ' Wp')} = ${v(e.fnModuli.skupajKwp, ' kWp')}` : '—'}`,
      'Razsmerniki:', ...(e.razsmerniki.length ? e.razsmerniki.map(r => `  - ${r.kos} × ${v(join([r.proizvajalec, r.model], ' '))}, ${v(r.mocKva, ' kVA')}, ${r.faze}, ${r.napetostV} V`) : ['  —']),
      `Instalirana moč: ${v(e.instaliranaMocKva, ' kVA')}`,
      `Priključna moč oddaje: obstoječa ${v(e.prikljucnaMocOddajeKw.obstojeca, ' kW')}, nova ${v(e.prikljucnaMocOddajeKw.nova, ' kW')}`,
      `Letna proizvodnja: ${e.letnaProizvodnjaKwh ? `${e.letnaProizvodnjaKwh.skupaj} kWh (lastne ${e.letnaProizvodnjaKwh.lastnePotrebe}, oddaja ${e.letnaProizvodnjaKwh.oddaja})` : '—'}`);
  }
  if (h) {
    L.push('', 'HRANILNIK', `Shema: ${v(h.shema)}`, `Način obratovanja: ${v(h.nacinObratovanja)}`,
      ...(h.enote.length ? h.enote.map(x => `  - ${x.kos} × ${v(join([x.proizvajalec, x.model], ' '))}, ${x.tehnologija}, ${v(x.kapacitetaKwh, ' kWh')}, polnjenje ${v(x.mocPolnjenjaKw, ' kW')}, praznjenje ${v(x.mocPraznjenjaKw, ' kW')}, ${x.faze}, ${x.napetostV} V`) : ['  —']),
      ...(h.skupaj ? [`Skupaj: ${v(h.skupaj.kapacitetaKwh, ' kWh')}, ${v(h.skupaj.mocPolnjenjaKw, ' kW')} / ${v(h.skupaj.mocPraznjenjaKw, ' kW')}`] : []));
  }
  if (d.manjka.length) L.push('', `Še manjka: ${d.manjka.join(', ')}`);
  return L.join('\n');
}

function izvoziPriklop(c) {
  const m = moci(c), L = lok(c);
  const vloga = {
    id: uid(), created: today(), updated: today(), dist: 'elektro-maribor', status: 'priprava',
    im: { tip: c.im.tip, ime: c.im.ime, priimek: c.im.priimek, naziv: c.im.naziv, odgovorna: '', ulica: join([c.im.ulica, c.im.hs], ' '), posta: c.im.posta, davcna: c.im.davcna, tel: c.im.tel, email: c.im.email },
    mm: {
      st: c.mm.gsrn || (c.mm.st !== '4-' ? c.mm.st : ''), szp: c.oddaja.szp, pmPrevzem: c.mm.pmOdjem, pmOddaja: c.oddaja.szpPm || c.el.pmNova,
      enako: c.mm.enako, ulica: c.mm.enako ? '' : join([L.ulica, L.hs], ' '), posta: c.mm.enako ? '' : L.posta, letno: m.letno ? String(Math.round(m.oddaja)) : ''
    },
    pn: { vrsta: m.hee.length ? 'sončna elektrarna s hranilnikom' : 'sončna elektrarna', samooskrba: true, panelModel: c.el.panelModel, panelKos: c.el.panelKos, panelWp: c.el.panelWp },
    rs: m.rs.map(r => ({ proizvajalec: r.proizvajalec, model: r.model, kva: r.kva, kos: kos(r), sodo: !!r.sodo })),
    hee: m.hee.map(h => ({ proizvajalec: h.proizvajalec, model: h.model, kwh: h.kwh, kvaP: h.kwP, kvaO: h.kwO, kos: kos(h), sodo: !!h.sodo })),
    pl: { drug: false }
  };
  download(`v-priklop_${fileBase(c)}.json`, JSON.stringify({ verzija: 1, izvoz: today(), vloge: [vloga] }, null, 2), 'application/json');
  toast(c.oddaja.szp ? 'Izvoženo – uvozite v Vloga-priklop (Vloge → Uvozi).' : 'Izvoženo brez številke soglasja – dopolnite jo v Vloga-priklop.');
}

/* ---------- PDF: pooblastila in tehnična dokumentacija (slog dokumentov ENSET) ---------- */
const b64 = str => Uint8Array.from(atob(str), ch => ch.charCodeAt(0));
const pdfReady = () => !!(window.PDFLib && window.fontkit && window.VS_PISAVA && window.VS_PISAVA_B);
let FONT_BYTES, FONTB_BYTES, LOGO_BYTES;
const TEHDOC = {}; // caseId -> { name, bytes, size } – zadnja pripravljena tehnična dokumentacija
const A4 = [595.28, 841.89], M = 42.5, W0 = A4[0] - 2 * M; // rob 15 mm kot v konfiguratorju ENSET
// Barve ENSET (petrolej + jantar iz logotipa), enake kot v ENSET-Konfiguratorji.
const hex = h => PDFLib.rgb(parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255);
const BARVE = { dark: '#1B6F73', accent: '#288C91', pale: '#EAF7F8', tint: '#F5FBFB', lineSoft: '#CFE4E6', rowLine: '#E6EFF0', amberInk: '#D9820F', ink: '#1F2933', grey: '#6E7E8E', body: '#4E5B63' };
const C = k => hex(BARVE[k]);

async function novDoc() {
  const doc = await PDFLib.PDFDocument.create();
  doc.registerFontkit(window.fontkit);
  FONT_BYTES ||= b64(window.VS_PISAVA); FONTB_BYTES ||= b64(window.VS_PISAVA_B);
  const font = await doc.embedFont(FONT_BYTES, { subset: true }), bold = await doc.embedFont(FONTB_BYTES, { subset: true });
  return { doc, font, bold };
}
function wrap(font, s, sz, w) {
  const out = [];
  for (const par of String(s ?? '').split('\n')) {
    let line = '';
    for (const word of par.split(/\s+/).filter(Boolean)) {
      const t = line ? line + ' ' + word : word;
      if (line && font.widthOfTextAtSize(t, sz) > w) { out.push(line); line = word; } else line = t;
    }
    out.push(line);
  }
  return out;
}
// Pisec dokumenta v slogu ENSET: glava z logotipom, razdelki (jantarni nadnaslov + naslov + petrolejna črta),
// okvirja strank, tabele s petrolejno glavo, podpisna polja in noga na vsaki strani.
function pisec(doc, F) {
  const { font, bold } = F, W = { page: null, y: 0 };
  // Razprte velike črke (nadnaslovi, oznake polj).
  const caps = (pg, t, x, y, sz, color, sp = 0.13) => {
    let xx = x; for (const ch of String(t).toUpperCase()) { pg.drawText(ch, { x: xx, y, size: sz, font: bold, color }); xx += bold.widthOfTextAtSize(ch, sz) + sz * sp; }
    return xx - x;
  };
  W.caps = caps;
  W.nova = () => { W.page = doc.addPage(A4); W.y = A4[1] - M; };
  W.prostor = h => { if (!W.page || W.y - h < M + 28) W.nova(); };
  W.gap = h => { W.y -= h; };
  W.rect = (x, yTop, w, h, o) => W.page.drawRectangle({ x, y: yTop - h, width: w, height: h, ...o });
  W.hline = (x0, x1, y, color = C('lineSoft'), t = 0.75) => W.page.drawLine({ start: { x: x0, y }, end: { x: x1, y }, thickness: t, color });
  // Glava: nadnaslov, naslov (krepko), logotip desno, petrolejna črta.
  W.glava = async (nadnaslov, naslovVrst) => {
    W.nova();
    const top = W.y;
    LOGO_BYTES ||= window.VS_LOGO ? b64(window.VS_LOGO) : null;
    let logoH = 0;
    if (LOGO_BYTES) {
      const img = await doc.embedPng(LOGO_BYTES), lw = 119, lh = lw * img.height / img.width;
      W.page.drawImage(img, { x: A4[0] - M - lw, y: top - lh - 1, width: lw, height: lh }); logoH = lh + 1;
    }
    caps(W.page, nadnaslov, M, top - 7, 6.8, C('amberInk'), 0.15);
    let y = top - 12;
    for (const t of naslovVrst) { y -= 21; W.page.drawText(t, { x: M, y, size: 19, font: bold, color: C('ink') }); }
    W.y = Math.min(y - 8, top - logoH - 6);
    W.hline(M, M + W0, W.y, C('accent'), 1.2);
    W.y -= 4;
  };
  // Trak s podatki: [[oznaka, vrednost], ...], širine v deležih.
  W.trak = (polja, sir) => {
    const kh = 15, vh = 24, h = kh + vh; W.prostor(h + 14); W.y -= 11;
    let x = M;
    polja.forEach(([k, v], i) => {
      const w = sir[i] * W0;
      W.rect(x, W.y, w, kh, { color: C('pale') });
      const kw = caps({ drawText() {} }, k, 0, 0, 6.2, C('grey'));
      caps(W.page, k, x + (w - kw) / 2, W.y - 10, 6.2, C('grey'));
      let vv = String(v || '—'), sz = 10.5; while (sz > 7 && bold.widthOfTextAtSize(vv, sz) > w - 12) sz -= 0.25;
      W.page.drawText(vv, { x: x + (w - bold.widthOfTextAtSize(vv, sz)) / 2, y: W.y - kh - 15.5, size: sz, font: bold, color: C('dark') });

// Slika -> JPEG z največ maxPx po daljši stranici (manjša datoteka).
async function slikaJpeg(file, maxPx = 1800, q = 0.82) {
  const bmp = await createImageBitmap(file), sc = Math.min(1, maxPx / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * sc); cv.height = Math.round(bmp.height * sc);
  const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(bmp, 0, 0, cv.width, cv.height);
  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', q));
  return { bytes: new Uint8Array(await blob.arrayBuffer()), w: cv.width, h: cv.height };
}
async function dodajDatoteko(doc, font, file, oznaka) {
  const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
  if (isPdf) {
    const src = await PDFLib.PDFDocument.load(await file.arrayBuffer(), { ignoreEncryption: true });
    const pages = await doc.copyPages(src, src.getPageIndices());
    pages.forEach(p => doc.addPage(p));
    return pages.length;
  }
  const j = await slikaJpeg(file), img = await doc.embedJpg(j.bytes);
  const land = j.w > j.h, size = land ? [A4[1], A4[0]] : A4, pg = doc.addPage(size);
  const mx = 30, top = 44, sc = Math.min((size[0] - 2 * mx) / j.w, (size[1] - top - mx) / j.h);
  pg.drawText(oznaka, { x: mx, y: size[1] - 28, size: 9, font, color: C('grey') });
  pg.drawImage(img, { x: (size[0] - j.w * sc) / 2, y: size[1] - top - j.h * sc, width: j.w * sc, height: j.h * sc });
  return 1;
}

/* ---------- ZIP (brez stiskanja, kot v Vloga-priklop) ---------- */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

  const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  let off = 0;
  for (const e of entries) {
    const nm = enc.encode(e.name), crc = crc32(e.data), sz = e.data.length;
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true);
    h.setUint16(10, time, true); h.setUint16(12, date, true); h.setUint32(14, crc, true);
    h.setUint32(18, sz, true); h.setUint32(22, sz, true); h.setUint16(26, nm.length, true);
    parts.push(h.buffer, nm, e.data);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true); cd.setUint16(8, 0x0800, true);
    cd.setUint16(12, time, true); cd.setUint16(14, date, true); cd.setUint32(16, crc, true);
    cd.setUint32(20, sz, true); cd.setUint32(24, sz, true); cd.setUint16(28, nm.length, true); cd.setUint32(42, off, true);
    central.push(cd.buffer, nm);
    off += 30 + nm.length + sz;
  }
  const cdSize = central.reduce((a, b) => a + b.byteLength, 0), end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, off, true);
  return new Blob([...parts, ...central, end.buffer], { type: 'application/zip' });
}

let PV = null; // { files: [{ name, bytes }], zip, url }
async function showPdf(c, kaj) {
  if (!pdfReady()) return toast('Knjižnice za PDF niso naložene.');
  try {
    let files, title, prikaz;
    if (kaj === 'poob') {
      files = (await genPooblastila(c)).map(x => ({ name: x.name, bytes: x.bytes }));
      prikaz = files.length > 1 ? await zdruziPdf(files.map(x => x.bytes)) : files[0].bytes;
      title = files.length > 1 ? `Pooblastila za podpis (${files.length}: ${podpisniki(c).map(osebaIme).join(', ')}) – Prenesi shrani ZIP` : 'Pooblastilo za podpis';
    } else {
      if (!await pripraviTeh(c)) return;
      files = [{ name: TEHDOC[c.id].name, bytes: TEHDOC[c.id].bytes }]; prikaz = files[0].bytes;
      title = `Tehnična dokumentacija (${fmtMB(prikaz.length)})`; renderEdit();
    }
    closePreview();
    PV = { files, zip: files.length > 1 ? `${fileBase(c)}_pooblastila_za_podpis.zip` : '', url: URL.createObjectURL(new Blob([prikaz], { type: 'application/pdf' })) };
    $('#pvTitle').textContent = title;
    $('#pvFrame').src = PV.url; $('#pvOpen').href = PV.url;
    $('#pv').hidden = false;
  } catch (err) { console.error(err); toast('Dokumenta ni bilo mogoče pripraviti.'); }
}
function closePreview() {
  $('#pv').hidden = true; $('#pvFrame').src = 'about:blank';
  if (PV) URL.revokeObjectURL(PV.url); PV = null;
}

render();
</script>
</body>
